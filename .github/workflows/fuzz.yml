name: fuzz

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
  # PR-time build guard only (no fuzzing): the fuzz crate is excluded from
  # the workspace, so nothing else ever compiles it — without this, a
  # psyrag-graph refactor could break the targets silently and we'd find
  # out at the next Monday-4am scheduled run.
  pull_request:
    paths:
      - "fuzz/**"
      - "psyrag-graph/**"
      - ".github/workflows/fuzz.yml"

jobs:
  build-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets (compile only)
        working-directory: fuzz
        run: cargo +nightly fuzz build

  fuzz:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [wal_replay, entity_json]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Run fuzzer (time-budgeted)
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
